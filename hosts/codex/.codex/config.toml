# Codex CLI MCP servers, generated from .mcp.json by scripts/gen-host-configs.py.
# Project-level config; if your Codex version only reads ~/.codex/config.toml, merge this block there.

[mcp_servers."discourse-openehr-org"]
command = "docker"
args = ["run", "-i", "--rm", "--init", "--pull=never", "--security-opt", "no-new-privileges", "-v", "${HOME}/.config/discourse-openehr-org.profile.json:/profile.json:ro", "discourse-mcp", "--profile", "/profile.json", "--site", "https://discourse.openehr.org", "--tools_mode", "discourse_api_only"]

[mcp_servers."atlassian"]
url = "https://mcp.atlassian.com/v2/mcp"
